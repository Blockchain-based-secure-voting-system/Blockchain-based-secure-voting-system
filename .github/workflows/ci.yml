name: CI - Security & Build Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests & Cryptographic Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Fast-Fail Check (Native CLI, Crypto & Core Crate)
        run: cargo check --package voting_crypto --package election_core --package cli --locked --verbose

      - name: Run Unit Tests (Cryptographic Suite, Core State Machine & CLI)
        run: cargo test --package voting_crypto --package election_core --package cli --locked --verbose

      - name: Run Server Unit & Integration Tests (Axum + PostgreSQL)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/voting_test
        run: cargo test --package server --test server_tests -- --test-threads=1

      # Browser WASM Crate Check
      - name: Check Browser Crypto WASM Crate Target Build
        run: cargo check --package voting_crypto_wasm --target wasm32-unknown-unknown --locked --verbose

      - name: Run Cargo Clippy (Native CLI, Crypto & Core Crate)
        run: cargo clippy --package voting_crypto --package election_core --package cli --locked -- -D warnings

      - name: Run Cargo Clippy (Server Crate)
        run: cargo clippy --package server --all-targets -- -D warnings

      - name: Build Axum Server Binary for E2E
        run: cargo build --package server --locked

      - name: Upload Server Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-bin
          path: target/debug/server

  frontend:
    name: Run Frontend Security Audit, Build, Grep, Headers, Axe & Playwright E2E
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Download Server Binary
        uses: actions/download-artifact@v4
        with:
          name: server-bin
          path: /tmp/server-bin

      - name: Start Real Axum Server + PostgreSQL
        run: |
          chmod +x /tmp/server-bin/server
          DATABASE_URL="postgres://postgres:postgres@localhost:5432/voting_test" ADMIN_TOKEN="admin_token" PORT=8080 /tmp/server-bin/server &
          for i in $(seq 1 30); do
            if curl -sI http://localhost:8080/healthz | grep -q "200 OK"; then
              echo "Real Axum Server running on port 8080"
              break
            fi
            sleep 1
          done
          curl -i http://localhost:8080/healthz

      - name: Setup Node.js (Pinned v24.15.0)
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies (Deterministic Lockfile)
        run: npm ci

      - name: Supply Chain Security Audit (npm audit)
        run: npm audit --audit-level=moderate

      - name: Run Frontend Unit & Component Security Tests (Vitest)
        run: npm test

      - name: Build Production Frontend Bundle (dist/)
        env:
          VITE_API_URL: http://localhost:8080
        run: npm run build

      - name: Verify Zero Test-Bypass Code in Production Bundle (dist/ Grep Gate)
        run: |
          echo "=== Verifying production dist/ contains zero test_auth or bypass markers ==="
          if grep -rnE "test_auth|ENABLE_E2E_TEST_BYPASS|E2E Automated Test Election|22be268019741f2fafe7cb402b489d701026dfa7ce9e585fdfdb4efea1211e40" dist/; then
            echo "ERROR: Test bypass strings found in production dist/!"
            exit 1
          fi
          echo "PASS: Zero test-bypass matches in production dist/."
          echo "=== Recording WASM Artifact SHA-256 Integrity Hash ==="
          sha256sum dist/assets/*.wasm src/crypto/pkg/voting_crypto_wasm_bg.wasm

      - name: Build Separate E2E Frontend Bundle (dist-e2e/)
        env:
          VITE_API_URL: http://localhost:8080
        run: npm run build:e2e

      - name: Verify Security & CSP Headers (curl -I Check)
        run: |
          nohup npm run preview -- --port 4173 > /tmp/preview.log 2>&1 &
          PREVIEW_PID=$!
          for i in $(seq 1 15); do
            if curl -sI http://localhost:4173 | grep -q "HTTP/1.1 200"; then
              break
            fi
            sleep 1
          done
          HEADERS=$(curl -sI http://localhost:4173)
          echo "$HEADERS"
          echo "$HEADERS" | grep -iq "Content-Security-Policy:.*default-src 'self'"
          echo "$HEADERS" | grep -iq "wasm-unsafe-eval"
          echo "$HEADERS" | grep -iq "X-Frame-Options: DENY"
          echo "$HEADERS" | grep -iq "X-Content-Type-Options: nosniff"
          echo "$HEADERS" | grep -iq "Referrer-Policy: strict-origin-when-cross-origin"
          kill $PREVIEW_PID || true

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E against Real Server + PostgreSQL
        env:
          USE_LIVE_REPLICA: 'true'
          VITE_API_URL: http://localhost:8080
        run: npx playwright test
