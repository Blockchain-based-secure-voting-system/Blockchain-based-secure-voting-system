name: CI - Security & Build Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests & Cryptographic Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Fast-Fail Check (Native CLI & Crypto Crate)
        run: cargo check --package voting_crypto --package cli --locked --verbose

      - name: Run Unit Tests (Cryptographic Suite & CLI)
        run: cargo test --package voting_crypto --package cli --locked --verbose

      # Canister only — mio/tokio-based crates (cli) must never be built against wasm32-unknown-unknown
      - name: Check Canister Wasm Target Build
        run: cargo check --package canister --target wasm32-unknown-unknown --locked --verbose

      - name: Run Cargo Clippy (Native CLI & Crypto Crate)
        run: cargo clippy --package voting_crypto --package cli --locked -- -D warnings

      # Canister only — mio/tokio-based crates (cli) must never be built against wasm32-unknown-unknown
      - name: Run Cargo Clippy (Wasm Canister)
        run: cargo clippy --package canister --target wasm32-unknown-unknown --locked -- -D warnings

  integration:
    name: Run Live Replica Integration Tests (DFX)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install DFX (Internet Computer SDK)
        run: |
          DFXVM_INIT_YES=true DFX_VERSION=0.20.1 sh -ci "$(curl -fsSL https://sdk.dfinity.org/install.sh)"
          echo "$HOME/.local/share/dfx/bin" >> $GITHUB_PATH

      - name: Start DFX Local Replica & Deploy Canister
        run: |
          export PATH="$HOME/.local/share/dfx/bin:$PATH"
          dfx start --background --clean
          dfx canister create canister
          cargo build --package canister --target wasm32-unknown-unknown --locked --release
          dfx deploy canister

      - name: Run End-to-End Live Canister Integration Test Suite
        run: |
          export PATH="$HOME/.local/share/dfx/bin:$PATH"
          chmod +x scripts/integration_test.sh
          ./scripts/integration_test.sh
