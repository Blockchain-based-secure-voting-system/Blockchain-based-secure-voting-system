[package]
name = "cli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
voting_crypto = { path = "../crates/voting_crypto" }
election_core = { path = "../crates/election_core" }
server = { path = "../crates/server" }
rand = "0.8"
hex = "0.4"
anyhow = "1.0"
sha2 = "0.10"
ark-bn254 = "0.4.0"
ark-ff = "0.4.0"
ark-ec = "0.4.0"
