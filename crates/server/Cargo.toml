[package]
name = "server"
version = "0.1.0"
edition = "2021"
description = "Axum REST API server with PostgreSQL persistence, bulletin board hash-chain, and cryptographic voting endpoints."

[dependencies]
election_core = { path = "../election_core" }
voting_crypto = { path = "../voting_crypto" }

axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.38", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit", "timeout"] }

sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json"] }

utoipa = { version = "4.2", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "7.1", features = ["axum"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
subtle = "2.5"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ark-bn254 = "0.4.0"
ark-ff = "0.4.0"
