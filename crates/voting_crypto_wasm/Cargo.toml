[package]
name = "voting_crypto_wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly (wasm-pack) bindings for browser-side electronic voting cryptography using BN254."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
voting_crypto = { path = "../voting_crypto" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"
thiserror = "1.0"
ark-bn254 = "0.4.0"
ark-ff = "0.4.0"
ark-ec = "0.4.0"
