services:
  - type: web
    name: voting-system-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: voting-system-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true

databases:
  - name: voting-system-db
    plan: free
    region: oregon
    databaseName: voting
    user: voting_user
